name: flex_notizbuch
description: Lokales FLEX-Notizbuch für Windows, Android und Web.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  sqlite3: 3.8.0
  uuid: 4.5.1
  path_provider: 2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
