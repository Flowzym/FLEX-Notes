name: flex_notizbuch
description: Lokales FLEX-Notizbuch für Windows, Android und Web.
publish_to: none
version: 0.16.0-rebuild.30+50
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flex_device:
    path: packages/flex_device
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  sqlite3: 3.8.0
  uuid: 4.5.1
  path_provider: 2.1.5
  cryptography: 2.9.0
  file_selector: ^1.1.0
  cupertino_icons: ^2.0.0
  pdf: ^3.13.1
  pdfrx: 2.12.0
  image: 4.12.0
  idb_shim: 2.11.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  workmanager: ^0.10.10
  http: ^1.6.0
  url_launcher: ^6.3.2
  archive: ^4.0.7
  xml: ^7.1.0
dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
    - assets/backgrounds/dark-texture.png
  fonts:
    - family: FlexSans
      fonts:
        - asset: assets/fonts/Selawik-Regular.ttf
        - asset: assets/fonts/Selawik-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Selawik-Bold.ttf
          weight: 700
    - family: FlexSerif
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
        - asset: assets/fonts/Gelasio-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gelasio-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gelasio-Bold.ttf
          weight: 700
