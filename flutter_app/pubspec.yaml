name: flex_notizbuch
description: Lokales FLEX-Notizbuch für Windows, Android und Web.
publish_to: none
version: 0.39.0+91
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flex_device:
    path: packages/flex_device
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  sqlite3: 3.8.0
  uuid: 4.5.1
  path_provider: 2.1.5
  cryptography: 2.9.0
  file_selector: ^1.1.0
  cupertino_icons: ^2.0.0
  pdf: ^3.13.1
  pdfrx: 2.12.0
  image: 4.12.0
  idb_shim: 2.11.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  workmanager: ^0.10.10
  http: ^1.6.0
  url_launcher: ^6.3.2
  archive: ^4.0.7
  xml: ^7.1.0
  share_plus: ^13.3.1
  cryptography_flutter: 2.3.4
  web: ^1.1.1
dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
hooks:
  user_defines:
    sqlite3:
      source:
        android: sqlcipher
        linux: sqlcipher
        default: sqlite3
flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
    - assets/licenses/SQLCipher.txt
    - assets/licenses/OpenSSL.txt
    - assets/licenses/AndroidX.txt
  fonts:
    - family: FlexSans
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
