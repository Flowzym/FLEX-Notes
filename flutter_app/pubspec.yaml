name: flex_notizbuch
description: Lokales FLEX-Notizbuch für Windows, Android und Web.
publish_to: none
version: 0.16.0-rebuild.14+34
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  sqlite3: 3.8.0
  uuid: 4.5.1
  path_provider: 2.1.5
  cryptography: 2.9.0
  file_selector: ^1.1.0
  cupertino_icons: ^2.0.0
dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
    - assets/backgrounds/dark-texture.png
  fonts:
    - family: FlexSans
      fonts:
        - asset: assets/fonts/Selawik-Regular.ttf
        - asset: assets/fonts/Selawik-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Selawik-Bold.ttf
          weight: 700
    - family: FlexSerif
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
        - asset: assets/fonts/Gelasio-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gelasio-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gelasio-Bold.ttf
          weight: 700
