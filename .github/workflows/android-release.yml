name: Signed Android release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: flex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/flutter-ci.yml
  release:
    name: Sign verified tag
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DASH__SUPPRESS_ANALYTICS: 'true'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false'
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github
            flutter_app
      - name: Require tag/version agreement before accessing signing material
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/android_release.py check-tag --tag "$RELEASE_TAG"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
        with:
          target: android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Prepare temporary signing files
        env:
          FLEX_RELEASE_KEYSTORE: ${{ secrets.FLEX_RELEASE_KEYSTORE }}
          FLEX_RELEASE_STORE_PASSWORD: ${{ secrets.FLEX_RELEASE_STORE_PASSWORD }}
          FLEX_RELEASE_KEY_PASSWORD: ${{ secrets.FLEX_RELEASE_KEY_PASSWORD }}
          FLEX_RELEASE_KEY_ALIAS: ${{ secrets.FLEX_RELEASE_KEY_ALIAS }}
          FLEX_SYMBOLS_PASSWORD: ${{ secrets.FLEX_SYMBOLS_PASSWORD }}
        run: python3 tool/android_release.py prepare --private "$RUNNER_TEMP/flex-signing"
      - name: Build obfuscated APKs with the permanent certificate
        env:
          FLEX_SIGNING_PROPERTIES: ${{ runner.temp }}/flex-signing/signing.properties
        run: flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info="$RUNNER_TEMP/flex-signing/symbols"
      - name: Verify and package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tool/android_release.py verify --out "$RUNNER_TEMP/flex-release"
          tar -czf "$RUNNER_TEMP/flex-signing/symbols.tar.gz" -C "$RUNNER_TEMP/flex-signing" symbols -C "$GITHUB_WORKSPACE/flutter_app/build/app/outputs/mapping/release" mapping.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/flex-signing/symbols-password" --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/flex-release/$RELEASE_TAG-symbols.tar.gz.gpg" "$RUNNER_TEMP/flex-signing/symbols.tar.gz"
      - name: Create draft release from this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Signierte FLEX-APKs. Zertifikat und Prüfsummen siehe release-manifest.json. Debugsymbole sind verschlüsselt.\n' > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/flex-release/"* --verify-tag --draft --title "FLEX $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Remove temporary private material
        if: always()
        run: python3 -c 'import os,shutil; shutil.rmtree(os.path.join(os.environ["RUNNER_TEMP"],"flex-signing"),ignore_errors=True)'
