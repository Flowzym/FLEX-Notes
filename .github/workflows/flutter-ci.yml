name: FLEX CI

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/**'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flex-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: flutter_app

env:
  CI: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

jobs:
  checks:
    name: Analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out application sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Avoid downloading historical APKs and recovery archives.
          sparse-checkout: |
            .github
            flutter_app

      - uses: ./.github/actions/setup-flutter
        with:
          target: checks

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool/drift_worker.dart packages/flex_device/lib

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Verify SQLite schema constraints
        run: python3 -m unittest discover -s tool -p test_schema.py -v

      - name: Run all Flutter tests with coverage
        env:
          FLEX_TEST_ARTIFACT_DIR: ${{ runner.temp }}/flex-test-reports
        run: |
          mkdir -p "$FLEX_TEST_ARTIFACT_DIR"
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee "$FLEX_TEST_ARTIFACT_DIR/flutter-tests.log"

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flex-test-reports/
            flutter_app/coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Android release build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # GitHub's small runners cannot use the local project's 8-GB JVM heap.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false'
    steps:
      - name: Check out application sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            flutter_app

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle.kts
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
            flutter_app/packages/**/android/*.gradle.kts

      - uses: ./.github/actions/setup-flutter
        with:
          target: android

      - name: Install the Android build toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Build the Android release configuration
        env:
          ORG_GRADLE_PROJECT_flexUnsignedRelease: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/flex-android-reports"
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/flex-android-reports/build.log"
          test -s build/app/outputs/flutter-apk/app-release.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/flex-android-reports/signature-check.log" 2>&1; then
            echo 'CI APK must remain unsigned.' >&2
            exit 1
          fi
        # Compile without the permanent private key. This APK is unsigned and
        # must not be distributed; the installation key stays outside GitHub.

      - name: Save Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flex-android-reports/
          retention-days: 14
          if-no-files-found: warn

  web:
    name: Web build and preview server
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out application sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            flutter_app

      - uses: ./.github/actions/setup-flutter
        with:
          target: web

      - name: Set up Go for preview server tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Prepare verified SQLite web assets
        run: |
          python3 tool/prepare.py --assets-only
          dart compile js -O2 tool/drift_worker.dart -o web/drift_worker.js

      - name: Build the web app
        run: |
          mkdir -p "$RUNNER_TEMP/flex-web-reports"
          flutter build web --release --no-pub --no-web-resources-cdn 2>&1 | tee "$RUNNER_TEMP/flex-web-reports/build.log"

      - name: Test the preview server over loopback HTTP
        run: python3 -m unittest discover -s tool -p test_preview_server.py -v 2>&1 | tee "$RUNNER_TEMP/flex-web-reports/server-tests.log"

      - name: Save web build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flex-web-reports/
          retention-days: 14
          if-no-files-found: warn

  passed:
    name: CI passed
    if: always()
    needs: [checks, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        working-directory: .
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$WEB_RESULT" = success
